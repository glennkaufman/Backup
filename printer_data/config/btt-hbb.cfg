#[*] Enable extra low-level configuration optionsMicro-controller
#Micro-controller Architecture (Raspberry Pi RP2040) --->
#Bootloader offset (No bootloader) --->
#Flash chip (W25Q080 with CLKDIV 2) --->
#Communication interface (USB) --->
#USB ids --->
#() GPIO pins to set at micro-controller startup

[mcu HBB]
serial: /dev/serial/by-id/usb-Klipper_rp2040_454741505B05834A-if00

[gcode_button key1]
pin: HBB: gpio25
press_gcode:
  SET_LED LED=HBB_LED RED=0 GREEN=0.8392 BLUE=0.8118 INDEX=1  #TRANSMIT=0
release_gcode:     
  LANE_UNLOAD LANE=lane4
  SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=1
  G4 P4000
  
