########################################
# LED Settings
########################################

[neopixel vendetta_leds]
pin: EBBCan:PD3
chain_count: 8
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. 1-7 in the logo and 8 at the lower shroud for nozzle.
color_order: GRB
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0

[neopixel Enclosure]
pin: mcu:PB10
chain_count: 7
color_order: GRB

initial_RED: 1
initial_GREEN: 1
initial_BLUE: 1

########################################
# LED Settings
########################################


[led_effect idle]
autostart:              False
frame_rate:             30
leds:
    neopixel:Enclosure

layers:
    breathing  10 1 top (.5,.5,1)

[led_effect loading_spool]
leds:
    neopixel:Enclosure
layers:
    chase          1  1.5   top        (0.0,  0.5, 1.0), (0.0, 1.0, 0.1)
    static         1  0     bottom     (0.5,  0.5, 0.5)
autostart:                             false
frame_rate:                            24
run_on_error:                          false

[led_effect unloading_spool]
leds:
    neopixel:Enclosure
layers:
    chase          -1  1.5   top        (0.0,  0.5, 1.0), (0.0, 1.0, 0.1)
    static         1  0     bottom     (0.5,  0.5, 0.5)
autostart:                             false
frame_rate:                            24
run_on_error:                          false
